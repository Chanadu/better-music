name: Better Music iOS IPA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ios-ipa.yml'
      - 'client/*.go'
      - 'client/go.mod'
      - 'client/go.sum'
      - 'deploy/ios/**'
      - 'frontend/static/pwa-icon-512.png'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: better-music-ios-${{ github.ref }}

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: client/go.mod
          cache-dependency-path: client/go.sum
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0
      - name: Build device IPA for SideStore
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          bash deploy/ios/build-ipa.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Better-Music-iOS
          path: client/packages/Better-Music.ipa
          if-no-files-found: error
      - name: Publish IPA for SideStore
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view ios-preview >/dev/null 2>&1; then
            gh release create ios-preview --target "$GITHUB_SHA" \
              --title "Better Music iOS Preview" --prerelease --latest=false \
              --notes "Latest successful iPhone build from main. Install with SideStore."
          fi
          gh release upload ios-preview client/packages/Better-Music.ipa --clobber
