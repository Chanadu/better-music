<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<link rel="icon" href="/favicon.ico" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<meta name="theme-color" content="#283142" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="Better Music" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<script>
			try {
				const theme = JSON.parse(localStorage.getItem('bettermusic:settings') ?? '{}').theme ?? 'bettermusic';
				document.documentElement.dataset.theme =
					theme === 'system' ?
						matchMedia('(prefers-color-scheme: dark)').matches ?
							'dark'
						:	'light'
					:	theme;
			} catch {}
		</script>
		%sveltekit.head%
	</head>

	<body class="bg-base-100 text-base-content min-h-screen font-semibold" data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
